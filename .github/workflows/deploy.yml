name: Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 🔐 Authenticate
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ☁️ Setup gcloud
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: product1advocateweb

      # 🧪 Debug (optional)
      - name: Verify Auth
        run: gcloud auth list

      # 📦 Build Image
      - name: Build Image
        run: |
          gcloud builds submit . --tag gcr.io/product1advocateweb/nextjs-app

      # 🚀 Deploy
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy nextjs-app \
            --image gcr.io/product1advocateweb/nextjs-app \
            --region europe-west1 \
            --platform managed \
            --allow-unauthenticated \
             --set-env-vars PORT=8080,MONGODB_DB_NAME="${{ secrets.MONGODB_DB_NAME }}",MONGODB_URI="${{ secrets.MONGODB_URI }}",DASHBOARD_PASSWORD="${{ secrets.DASHBOARD_PASSWORD }}",R2_ENDPOINT="${{ secrets.R2_ENDPOINT }}",R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}",R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}",OPENAI_ASSISTANT_ID="${{ secrets.OPENAI_ASSISTANT_ID }}",OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}",QUICK_REPLIES="${{ secrets.QUICK_REPLIES }}",FEE_LINK="${{ secrets.FEE_LINK }}",BANK_TRANSFER_QR_LINK="${{ secrets.BANK_TRANSFER_QR_LINK }}" \
             --timeout 120 \
             --max-instances 10 \
             --memory 1Gi