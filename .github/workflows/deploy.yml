name: Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: product1advocateweb
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Build & Deploy
        run: |
          gcloud builds submit --tag gcr.io/product1advocateweb/nextjs-app
          gcloud run deploy nextjs-app \
            --image gcr.io/product1advocateweb/nextjs-app \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated