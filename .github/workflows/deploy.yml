name: Deploy to GCP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 🔐 Authenticate
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ☁️ Setup gcloud
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: product1advocateweb

      # 🧪 Debug (optional)
      - name: Verify Auth
        run: gcloud auth list

      # 📦 Build Image
      - name: Build Image
        run: |
          gcloud builds submit . --tag gcr.io/product1advocateweb/nextjs-app

      # 🚀 Deploy
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy nextjs-app \
            --image gcr.io/product1advocateweb/nextjs-app \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated